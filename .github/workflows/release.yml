name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the version
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml has $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build the app
        run: ./scripts/bundle.sh --universal --zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            libegl1-mesa-dev libvulkan-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Shepherd $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
