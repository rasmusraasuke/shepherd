[package]
name = "shepherd"
version = "0.1.0"
edition = "2024"
description = "A lightweight code editor for the age of agents"
license = "MIT"
repository = "https://github.com/rasmusraasuke/shepherd"

[dependencies]
alacritty_terminal = "0.26"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
eframe = "0.37.0"
egui_tiles = "0.18"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-language = "0.1.9"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[dev-dependencies]
egui_kittest = "0.37"
